# Document template for the auto-sidecar-generation experiment
# (core/auto_sidecar.py, scripts/auto_generate_sidecar.py).
#
# Fractions are relative to the DESKEWED page (width/height), not pixel
# coordinates - a scan's absolute resolution varies, but a given form's
# layout proportions don't. regions_approx values are GUIDES for where
# to search, not authoritative: core/auto_sidecar.py's boundary locators
# prefer an actually-detected printed ruling line/border within a window
# around these positions, and only fall back to the raw fraction if
# nothing is found.
#
# REBUILT 2026-08-08, widened SAME DAY from 3 to 6 real calibrations via
# ui/column_calibration_ui.py's full workflow (dividers + "Mark table
# left/right edges" - e002869157 through e002869162, all review_status
# "done", zero unreviewed dividers, table edges human_placed on all 6
# from the start). Replaces the original 2026-07-27 version, which was
# explicitly flagged as "one sample is a thin calibration base" and only
# covered 6 core fields (5 of them actually calibrated) - this version
# covers the FULL real 35-field 1921 schedule (config/columns/
# census_canada_1921.txt), not just a curated subset.
#
# REAL FINDING from the 3->6 widen: max per-divider spread across all 6
# samples is just 0.23% of table width - MUCH tighter agreement than
# canada_census_1906.yaml's ~5% (that batch mixed pages from a bound-
# book split workflow with more scan-to-scan registration variance; this
# 1921 batch's 6 samples come from a more consistent scan source). All 6
# independently detected exactly 50/50 rows with zero quarantined -
# strong convergence, not just a bigger n.

doc_type: canada_census_1921
display_name: "Canada Census 1921"

# The full 35-field 1921 schedule (dwelling/family identification,
# birthplace/immigration/nationality, language/religion/literacy,
# occupation/employment/earnings - a much richer form than the 6-field
# "core" subset the previous version tracked). Real column names,
# verbatim off the form, supplied directly by Jon - not guessed.
columns_file: census_canada_1921.txt

# expected_row_count=50, per Jon's direct confirmation (2026-08-08) -
# matches the PREVIOUS version's own value exactly (unchanged), and now
# backed by real detection too: all 3 samples in this batch
# independently detected exactly 50/50 rows with zero quarantined.
row_strategy: fixed_periodic
expected_row_count: 50

expected_columns:
  - Dwelling house
  - Family
  - Name of each person in family
  - Parish or Township
  - Name of the municipality
  - Home owned or rented
  - If rented, monthly rent paid
  - Class of house
  - Material of construction
  - Number of rooms occupied by this family
  - Relationship to head of family or household
  - Sex
  - Conjugal condition
  - Age at last birthday
  - Country or place of birth of person
  - Country or place of birth of father
  - Country or place of birth of mother
  - Year of immigration to Canada
  - Year of naturalization
  - Racial or tribal origin
  - Nationality
  - Can speak English
  - Can speak French
  - Religion
  - Can read and write
  - Months at school since September 1, 1920
  - Chief occupation or trade
  - Industry or business
  - Employment status
  - Total earnings in past 12 months
  - Whether out of work on June 1, 1921
  - Number of weeks unemployed in past 12 months
  - Number of weeks unemployed because of illness
  - Time employed in other than chief occupation
  - Language commonly spoken / Infirmities

# x_frac is relative to the table's own left-right span (table_bbox),
# same basis every other template here uses. Every boundary is n=6 -
# all 6 samples fully "done", including the table's own outer edges
# (human-placed via "Mark table left/right edges" on all 6 from the
# start - "Dwelling house"'s left edge and "Language commonly spoken /
# Infirmities"'s right edge are both real, not the raw auto-detected
# frame margin).
column_regions_approx:
  Dwelling house: {x_frac: [0.0000, 0.0137]}  # n=6
  Family: {x_frac: [0.0137, 0.0272]}  # n=6
  Name of each person in family: {x_frac: [0.0272, 0.1231]}  # n=6

# NOT SET - no header-number anchor band was calibrated in this batch
# (out of scope for this rebuild). Optional field - templates without it
# just skip the number-row anchor and rely on column_regions_approx
# alone.
# number_row_approx: not set

# Real row height, AS A FRACTION OF PAGE HEIGHT - RECOMPUTED 2026-08-09
# (replacing the prior 0.01472, which was ~13% too high and caused real
# tiling failures - see below). The prior value was computed from row
# BBOX HEIGHT across the 6 samples, not true row-to-row PITCH (top-to-
# top spacing), same bug class already found and fixed for
# canada_census_1906.yaml on 2026-08-09. Confirmed via the new row-pitch
# sanity check in ui/column_calibration_ui.py: even with the "clean"
# 6-sample 0.01472 value, the tool flagged row 50's expected end as
# 243px past the actual page bottom for e002869157 - and a live
# generate_auto_sidecar() run against that exact page independently
# confirmed the failure (46/50 rows, "tiled span runs 213px past the
# image's actual bottom edge" warning), not just a theoretical concern.
# Recomputed from real row1_top -> row50_top pitch across all 6 merged
# sidecars: e002869157 64.0px (frac 0.01374), e002869158 54.0px
# (0.01180), e002869159 58.0px (0.01241), e002869160 62.4px (0.01350),
# e002869161 61.0px (0.01312), e002869162 63.2px (0.01351) - mean
# 0.01301.
expected_row_height_frac: 0.01301

# metadata's TOP edge uses the REAL detected physical page boundary
# (core/image_analysis.py's analyze_image(), run directly against
# e002869157.png, 7230x4658: page bbox [275.6, 230.5, 6954.4, 4419.3] -
# the page occupies 83.1% of the raw frame, a real border/surround on
# this scan) - unaffected by the 3->6 widen (page-edge detection doesn't
# depend on the calibration batch size). header's y_frac is a rough
# placeholder (never recalibrated for 1921 specifically, since header/
# metadata boxes are out of scope for ui/column_calibration_ui.py by
# design). table's y/x are the real 6-sample-averaged, human-corrected
# table_bbox.
regions_approx:
  metadata:
    y_frac: [0.0495, 0.157]
  header:
    y_frac: [0.157, 0.3105]
  table:
    y_frac: [0.3105, 0.9849]
    x_frac: [0.0770, 0.9409]

# Used by core/document_classification.py's rule-based scorer. UNCHANGED
# from the prior version - still based on the original single 2026-07-27
# reference measurement (aspect_ratio 1.568, vertical_ruling_lines ~11),
# not re-measured against this new batch. Worth re-measuring once more
# samples exist and this gets revisited.
classification:
  aspect_ratio_range: [1.40, 1.75]
  row_count_range: [44, 56]
  column_count_range: [6, 16]

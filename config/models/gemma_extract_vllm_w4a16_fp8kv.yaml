model_name: gemma_extract_vllm_w4a16_fp8kv
repo_id: google/gemma-4-E2B-it-qat-w4a16-ct
# SAME checkpoint as gemma_extract_vllm_w4a16.yaml, graphs ON,
# context_length 4096 (back to the original value - this experiment
# isolates KV-cache dtype, not context length; compounding it with
# ctx1024's already-negative result would muddy which change did what).
# Every field below is identical to gemma_extract_vllm_w4a16.yaml
# EXCEPT extra.vllm_kv_cache_dtype (new) and this model_name/role.
#
# WHY THIS EXISTS (2026-08-16): the fourth VRAM lever, after three
# straight negative results this session (--gpu-memory-utilization via
# vram_headroom_gb, --enforce-eager, --max-model-len - see
# gemma_extract_vllm_w4a16_ctx1024.yaml's own comment for that
# scorecard). This one is mechanistically different from all three:
# it shrinks the per-token KV-CACHE ENTRY SIZE itself (fp8 instead of
# the default fp16/bf16 - roughly half the bytes per cached token),
# rather than changing the utilization ceiling, skipping graph capture,
# or capping how long a context vLLM plans for. Verified before use:
# vLLM's TritonAttentionBackend (confirmed as this checkpoint's actual
# backend, see this project's own startup logs) supports fp8/fp8_e4m3/
# fp8_e5m2 kv-cache-dtype values; plain "fp8" needs no calibration file
# (vLLM defaults K/V scales to 1.0) per vLLM's quantized_kvcache docs.
# Documented caveat from those same docs, not yet independently
# verified: sliding-window attention layers are more sensitive to
# KV-cache quantization than global-attention layers - this run's
# quality result (pass/fail pattern) IS that verification, not assumed
# away from the docs alone.
#
# UNTESTED until a real run completes - see vision_validation_status.
loader_class: vllm   # sentinel - see qwen25_vl_7b_awq.yaml's comment.
runtime: vllm

do_sample: false
temperature: 0.1
top_p: 0.9
top_k: 20
repetition_penalty: 1.15
no_repeat_ngram_size: 5   # inert under vLLM - see gemma_extract_vllm.yaml's identical note.
max_new_tokens: 512

min_pixels: null
max_pixels: null

reasoning_toggle_mechanism: system_prompt
reasoning_enabled: false

text_only_supported: true
image_input_supported: true
# PRIOR RESULT (this was actually run live 2026-08-16 at --max-num-seqs
# 256 default, but its result was never written back to this file
# before the next experiment started - correcting that omission now):
# 4/5 pass (80%), identical per-case pattern to every other
# gemma_extract* config - the documented sliding-window-sensitivity
# risk did NOT materialize as a quality regression here. VRAM
# 15922->15927MB (+5MB, noise), tok/s 69.9->73.16 (no meaningful
# change), cold load 183.1s->261.1s (higher, consistent with the
# run-to-run variance already seen on ctx1024). Conclusion held:
# --kv-cache-dtype fp8 was NOT the lever - makes sense in retrospect,
# since the ctx1024 test already showed KV-cache size was never the
# dominant consumer for this checkpoint's real (small) usage.
#
# RE-VALIDATED 2026-08-16 at --max-num-seqs 4: 4/5 pass (unchanged
# pattern, same table_form_interpretation fail) - the documented
# sliding-window-sensitivity risk did NOT materialize as a quality
# regression under this combination either. VRAM 15927MB -> 14956MB
# (-971MB), tok/s 73.2 -> 68.8 (no regression, within normal variance).
# Consistent with every other sibling's result: max-num-seqs delivers
# real VRAM savings independent of the other lever compounded with it.
vision_validation_status: validated

restrict_output_charset: true   # inert under vLLM - see gemma_extract_vllm.yaml's identical note.

prompt_version: v1
prompt_text: ""

extra:
  image_token_budget: 560   # NOT read by the vLLM path - see gemma_extract_vllm.yaml's identical note.
  system_prompt: |
    You are an OCR transcription model.

    Transcribe exactly what appears in the image.
    If unreadable, output only "?".
    Do not describe the image.
    Do not explain your reasoning.
  # Graphs stay ON (no vllm_enforce_eager here) - isolating KV-cache
  # dtype as the only changed variable vs. gemma_extract_vllm_w4a16.yaml.
  # THE ONE FUNCTIONAL DIFFERENCE from that config. Read by
  # core/vllm_runtime.py's acquire(), which appends
  # "--kv-cache-dtype fp8" to the launch command only when this is set
  # (added 2026-08-16 specifically for this experiment). Plain "fp8"
  # (not fp8_e4m3/fp8_e5m2 specifically) - letting vLLM pick its own
  # default e4m3 variant for this CUDA version rather than pinning one
  # without a specific reason to.
  vllm_kv_cache_dtype: fp8
  # Adopted 2026-08-16 - see gemma_extract_vllm_w4a16.yaml's identical
  # note for the source of this value.
  vllm_max_num_seqs: 4

# Unchanged from gemma_extract_vllm_w4a16.yaml's own hard-won value -
# isolating kv_cache_dtype as the one variable under test here. A
# smaller per-token KV entry size could in principle allow MORE KV
# blocks in the same pool (not a memory reduction at the SAME sequence
# count, but more headroom before hitting the "-4.58 GiB" style
# failure this project saw at low headroom) - not re-tuned downward
# preemptively; verify first.
vram_headroom_gb: 2.5
context_length: 4096   # back to the original value - see this file's own header note.

role: extraction_candidate_vllm_quantized_fp8kv   # descriptive only.

model_name: gemma_extract_vllm_w4a16_hr31
repo_id: google/gemma-4-E2B-it-qat-w4a16-ct
# Headroom follow-up experiment (2026-08-15): identical to the current
# production gemma_extract_vllm_w4a16.yaml (graphs ON, normal KV,
# ctx4096, seqs 4, mm-limit image-only) EXCEPT vram_headroom_gb
# 2.5 -> 3.1 (util 0.84 -> 0.81). HYPOTHESIS: the mm-limit flag freed
# ~0.6GiB of provisioning that vLLM re-invested into KV cache (6.37GiB
# available vs 5.77 pre-flag); shrinking the budget by the same amount
# should return that memory to the CARD instead, with KV capacity
# still >= the pre-mm-limit baseline - same quality, same tok/s, net
# VRAM ~600MB lower. Measured, not assumed.
loader_class: vllm
runtime: vllm

do_sample: false
temperature: 0.1
top_p: 0.9
top_k: 20
repetition_penalty: 1.15
no_repeat_ngram_size: 5   # inert under vLLM - see gemma_extract_vllm.yaml.
max_new_tokens: 512

min_pixels: null
max_pixels: null

reasoning_toggle_mechanism: system_prompt
reasoning_enabled: false

text_only_supported: true
image_input_supported: true
# VALIDATED 2026-08-15 (live, vision_baseline_v4): 4/5 (unchanged
# pattern), 73.5 tok/s (within the 70-81 run-to-run band, no
# regression), init 144s (same), net-of-baseline VRAM 13293MB vs the
# production config's 13810MB (-517MB - close to the predicted
# ~600MB). HYPOTHESIS CONFIRMED: shrinking the utilization budget by
# roughly what the mm-limit flag freed returns that memory to the
# CARD instead of vLLM's KV pool, at no quality/throughput cost.
# RECOMMENDED to fold vram_headroom_gb: 3.1 into the production
# config (gemma_extract_vllm_w4a16.yaml) - presented as a candidate,
# not silently applied.
vision_validation_status: validated

restrict_output_charset: true   # inert under vLLM - see gemma_extract_vllm.yaml.

prompt_version: v1
prompt_text: ""

extra:
  image_token_budget: 560   # inert under vLLM - see gemma_extract_vllm.yaml.
  system_prompt: |
    You are an OCR transcription model.

    Transcribe exactly what appears in the image.
    If unreadable, output only "?".
    Do not describe the image.
    Do not explain your reasoning.
  # THE ONE FUNCTIONAL DIFFERENCE from gemma_extract_vllm_w4a16.yaml.
  vllm_max_num_seqs: 4
  vllm_limit_mm_per_prompt: '{"image": 1, "video": 0, "audio": 0}'

vram_headroom_gb: 3.1
context_length: 4096

role: extraction_candidate_vllm_quantized_hr31   # descriptive only.

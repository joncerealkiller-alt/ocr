model_name: gemma_e4b_w4a16
repo_id: google/gemma-4-E4B-it-qat-w4a16-ct
# Sentinel - see qwen25_vl_7b_awq.yaml's comment; runtime "vllm" models
# never instantiate a loader class.
loader_class: vllm

# 2026-08-13, multi-runtime integration (plan addendum). compressed-
# tensors w4a16 checkpoint, confirmed live under vLLM 0.27.1 in
# ~/venv_vllm: 9.93GiB resident / 1.18s generation. THE checkpoint the
# whole runtime investigation started from: Benchmark 2.3's "E4B is
# 4.8x slower than E2B" finding was an artifact of the mobile-QAT
# checkpoint under plain transformers, not a real E4B capability
# result - under its intended format (w4a16-ct) and runtime (vLLM),
# E4B is in the same performance neighborhood as E2B. NOTE: this is a
# DIFFERENT checkpoint from config/models/gemma_e4b.yaml (the
# mobile-transformers QAT one) - same underlying model, different
# quantization format, different runtime.
runtime: vllm

vram_headroom_gb: 2.4
context_length: 4096

do_sample: false
temperature: 0.1
max_new_tokens: 400

text_only_supported: true    # confirmed live - the PONG test turn was text-only
image_input_supported: true  # full multimodal E4B checkpoint
# VALIDATED 2026-08-15 at max_num_seqs 4 - first FULL vision_baseline_
# v4 run for this config: 3/5 pass, 47.1 tok/s, net-of-baseline VRAM
# ~13.8GB (vs ~14.6GB for the seqs-256 control run, -790MB). QUALITY
# CAVEAT, verified by a same-day control run at default 256 seqs
# (gemma_e4b_w4a16_seqs256_control.yaml - byte-identical failing
# outputs): E4B inherently scores 3/5 on this suite, WORSE than E2B's
# 4/5 - it truncates surnames in field_extraction ("John Test" /
# "Jane Placeholder", dropping the final name token) and misses the
# same table fields E2B does plus more. NOT a max_num_seqs artifact.
# Real model evidence: the bigger E4B is not better than E2B for this
# extraction workload - relevant to any future E4B-as-escalation-
# reviewer plans (see project memory on the E2B/E4B architecture).
# RE-VALIDATED 2026-08-15 with mm-limit flag: 3/5 (E4B's inherent
# pattern, control-verified earlier - unchanged), 50.2 tok/s (was
# 47.1), init 162s (was 276s, -114s), net VRAM ~14.1GB (within the
# baseline-drift noise band of the prior ~13.8GB - not a regression
# claim either way).
vision_validation_status: validated
role: vision_candidate

# Adopted 2026-08-15 from the E2B family's confirmed win (256->4, see
# gemma_extract_vllm_w4a16_lowseqs.yaml).
vllm_max_num_seqs: 4
# Adopted 2026-08-15 from the mmlimit experiment (gemma_extract_vllm_
# w4a16_mmlimit.yaml: same quality, ~30s faster init, 0.6GiB of
# unused-modality provisioning freed - vLLM defaults unspecified
# modalities to 999 items/prompt; this workload is exactly 1 image).
vllm_limit_mm_per_prompt: '{"image": 1, "video": 0, "audio": 0}'

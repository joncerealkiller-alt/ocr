# Generated 2026-08-15 (Fable session) - see description. Version rule
# applies as everywhere: any edit to prompts/GT/assets -> new version file.
suite_id: census_fieldcrops
version: '1'
display_name: Census Per-Field Crops v1 (real 1931 cells)
description: 'Sixteen single-cell crops (4 rows x Name/Age/Birthplace/Relationship) from the same real
  1931 census page as census_headtohead_v1, cut with the sidecar''s human-calibrated column ranges - the
  pipeline''s ACTUAL per-field crop shape. Ground truth from ground_truth_log.jsonl. Built for the deployment-grade
  12B-vs-E2B comparison: does the 3.3x gap measured on full-row strips survive on real per-field inputs?
  Sex column deliberately excluded (substring-scorer hazard).'
required_capability: vision
generation_settings:
  do_sample: false
  temperature: 0.1
  top_p: 0.9
  top_k: 20
  repetition_penalty: 1.15
  max_new_tokens: 60
cases:
- case_id: r4_name
  category: field_name
  image_path: data/_test_fixtures/census_1931_r4_name.png
  prompt: This is a small crop of a single handwritten cell from the Name column of a 1931 Canadian census
    table (a fragment of the adjacent row may show at the edge - read the central entry only). Transcribe
    exactly the name written in this cell. Reply with only the transcription; if unreadable, reply only
    "?".
  scorer: contains_all
  scorer_args:
    keywords:
    - Dorothy
  expected_display: 'GT: ditto-mark + "Dorothy"'
- case_id: r4_age
  category: field_age
  image_path: data/_test_fixtures/census_1931_r4_age.png
  prompt: This is a small crop of a single handwritten cell from the Age column of a 1931 Canadian census
    table (a fragment of the adjacent row may show at the edge - read the central entry only). Transcribe
    exactly the number written in this cell. Reply with only the transcription; if unreadable, reply only
    "?".
  scorer: exact_match_any
  scorer_args:
    expected_any:
    - '12'
  expected_display: 'GT: 12'
- case_id: r4_birthplace
  category: field_birthplace
  image_path: data/_test_fixtures/census_1931_r4_birthplace.png
  prompt: This is a small crop of a single handwritten cell from the Birthplace column of a 1931 Canadian
    census table (a fragment of the adjacent row may show at the edge - read the central entry only).
    Transcribe exactly the place written in this cell. Reply with only the transcription; if unreadable,
    reply only "?".
  scorer: contains_any
  scorer_args:
    keywords:
    - Manitoba
  expected_display: 'GT: Manitoba'
- case_id: r4_rel
  category: field_rel

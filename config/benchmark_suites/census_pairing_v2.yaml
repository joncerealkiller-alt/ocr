# Generated 2026-08-15 (Fable session) - see description.
suite_id: census_pairing
version: '2'
display_name: Census Pairing v2 (same 35 cells, production 160px-height LANCZOS upscale)
description: 'Identical cells/prompts/GT to census_pairing_v1, but every asset upscaled to 160px height
  with LANCZOS - matching the production two-stage pipeline''s stage1/2_upscale_target_height=160 preprocessing
  (core/image_preprocessing.upscale). Built 2026-08-15 after Jon''s observation that upscaling aids the
  human reviewer flagged a fidelity gap: v1 fed raw ~56px crops while production upscales, and Qwen self-upscales
  via min_pixels while the others don''t - so v1 rankings may not transfer to production preprocessing.'
required_capability: vision
generation_settings:
  do_sample: false
  temperature: 0.1
  top_p: 0.9
  top_k: 20
  repetition_penalty: 1.15
  max_new_tokens: 60

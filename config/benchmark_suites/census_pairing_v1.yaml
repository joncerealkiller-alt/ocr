# Generated 2026-08-15 (Fable session) - see description.
suite_id: census_pairing
version: '1'
display_name: Census Pairing v1 (35 per-field cells, raw-read collection)
description: 'Thirty-five single-cell crops (rows 1-6 + 9 of the 1931 page x Name/Age/Sex/Relationship/Birthplace)
  with merged human GT in expected_display. All cases use the manual scorer ON PURPOSE: this suite collects
  each model''s independent raw reads so ensemble-pairing analysis (agreement precision / false-auto-accept
  / union-correct for every model pair) can be computed offline with consistent rules - including Sex,
  which the substring scorers cannot safely score. Built 2026-08-15 to choose which two models take the
  independent-read roles in the hint-free two-stage design (docs/TWO_STAGE_HINT_FREE_PROPOSAL.md).'
required_capability: vision
generation_settings:
  do_sample: false
  temperature: 0.1
  top_p: 0.9
  top_k: 20
  repetition_penalty: 1.15
  max_new_tokens: 60
cases:
- case_id: r1_name
  category: field_name
  image_path: data/_test_fixtures/census_1931_r1_name.png
  prompt: This is a small crop of a single handwritten cell from the Name column of a 1931 Canadian census
    table (a fragment of the adjacent row may show at the edge - read the central entry only). Transcribe
    exactly the name written in this cell. Reply with only the transcription; if unreadable, reply only
    "?".
  scorer: manual
  scorer_args: {}
  expected_display: 'GT: Hawkins James'
